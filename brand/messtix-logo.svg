<svg viewBox="0 0 500 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Messtix, by María Sánchez">
  <title>Messtix — by María Sánchez</title>

  <!-- Icon mark: three bars -->
  <g id="icon-mark" transform="translate(0,42)">
    <rect x="0"  y="20" width="14" height="46" rx="7" fill="#141212"/>
    <rect x="27" y="0"  width="14" height="66" rx="7" fill="#7a1128"/>
    <rect x="54" y="20" width="14" height="46" rx="7" fill="#141212"/>
  </g>

  <!-- Wordmark -->
  <text id="wordmark" x="102" y="95"
        font-family="'Poppins','Century Gothic','Arial Rounded MT Bold',sans-serif"
        font-weight="800" font-size="54" letter-spacing="-0.5" fill="#141212">
    mess<tspan fill="#7a1128">tix</tspan>
  </text>

  <!-- Subtitle -->
  <text id="subtitle" x="104" y="128"
        font-family="'Inter',-apple-system,'Segoe UI',sans-serif"
        font-weight="500" font-size="22" letter-spacing="0.04em" fill="#5b5555">
    by María Sánchez
  </text>
</svg>
